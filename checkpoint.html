<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контрольная — English Trainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <!-- 1. Вступление -->
    <section id="view-intro" class="hidden">
      <h1>Контрольная проверка</h1>
      <div id="intro-box"></div>
    </section>

    <!-- 2. Вопрос -->
    <section id="view-question" class="hidden">
      <div class="test-top">
        <span id="q-section" class="muted"></span>
        <span id="q-counter" class="muted small"></span>
      </div>
      <div class="progress-bar"><div id="q-progress"></div></div>

      <div id="q-passage"></div>
      <div class="card">
        <p class="question" id="q-text"></p>
        <div class="options" id="q-options"></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="next-btn" disabled>Далее</button>
          <button class="btn" id="dont-know-btn">Не знаю</button>
        </div>
      </div>
      <p class="muted small">На компьютере: клавиши 1–4 — выбор ответа, Enter — далее.</p>
      <button class="btn btn-small" id="quit-btn">Прервать</button>
    </section>

    <!-- 3. Результат -->
    <section id="view-result" class="hidden"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="data/topics.js"></script>
  <script src="data/exercises/a1.js"></script>
  <script src="data/exercises/a2.js"></script>
  <script src="data/exercises/b1.js"></script>
  <script src="data/exercises/b2.js"></script>
  <script src="data/exercises/c1.js"></script>
  <script src="data/exercises/listen-a1.js"></script>
  <script src="data/exercises/listen-a2.js"></script>
  <script src="data/exercises/listen-b1.js"></script>
  <script src="data/exercises/listen-b2.js"></script>
  <script src="data/exercises/listen-c1.js"></script>
  <script src="data/reading/texts.js"></script>
  <script src="data/words/a1.js"></script>
  <script src="data/words/a2.js"></script>
  <script src="data/words/b1.js"></script>
  <script src="data/words/b2.js"></script>
  <script src="data/words/c1.js"></script>
  <script src="data/placement-test.js"></script>
  <script src="data/checkpoints.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/common.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/level.js"></script>
  <script src="js/pages/checkpoint.js"></script>
</body>
</html>
